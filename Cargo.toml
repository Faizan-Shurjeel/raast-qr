[workspace]
resolver = "2"
members = [
    "crates/raast-qr",
    "crates/raast-qr-cli",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
authors = ["Muhammad Faizan Shurjeel <muhammadfaizanshurjeel@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Faizan-Shurjeel/raast-qr"
readme = "README.md"
keywords = ["raast", "emvco", "fintech", "pakistan", "qr"]
categories = ["cryptography", "parser-implementations", "no-std"]

[workspace.dependencies]
rust_decimal = { version = "1.33", default-features = false }
rust_decimal_macros = "1.33"
winnow = { version = "0.6", default-features = false, features = ["simd"] }
thiserror = { version = "1.0", default-features = false }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
